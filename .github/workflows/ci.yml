name: Verify and deploy calendars

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.sha }}

jobs:
  test:
    name: Lint, coverage, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Find affected base
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "BASE_SHA=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Check affected packages
        run: npx nx affected -t lint,test:coverage,build --base="$BASE_SHA" --head="$HEAD_SHA" --parallel=3

  browser:
    name: Browser visuals and interactions
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HUSKY: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run browser contract
        run: npm run test:browser

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy and smoke-test feeds and explorer
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Find affected deployables
        id: affected
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          fi
          affected=$(npx nx show projects --affected --base="$BASE_SHA" --head="$HEAD_SHA" --json)
          echo "$affected"
          if [[ "$affected" == *'"backend"'* ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$affected" == *'"frontend"'* ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy affected projects
        run: npx nx affected -t deploy --base="$BASE_SHA" --head="$HEAD_SHA" --parallel=2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # A new custom domain can be live before its certificate is ready.
      - name: Wait for the backend feeds to be served
        if: steps.affected.outputs.backend == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl -A codex-ci -X GET --fail --no-progress-meter --output /dev/null https://cal.janejeon.dev/codex-resets.ics \
              && curl -A codex-ci -X GET --fail --no-progress-meter --output /dev/null https://cal.janejeon.dev/dtsm-events.ics; then
              exit 0
            fi
            sleep 10
          done
          echo "The backend feeds did not return 200 within 5 minutes" >&2
          exit 1

      # Only the deployed-feed block: a rate limit from the upstream API
      # must not fail a deploy that already happened.
      - name: Smoke-test the deployed backend feed
        if: steps.affected.outputs.backend == 'true'
        working-directory: backend
        run: npx vitest run test/e2e -t 'deployed feed'
        env:
          RUN_E2E: '1'
          DEPLOYED_URL: https://cal.janejeon.dev/codex-resets.ics

      # Bot Fight Mode on janejeon.com challenges GitHub runners. The immutable
      # Version URL serves the same deployed Worker version through workers.dev.
      - name: Resolve deployed frontend Version URL
        if: steps.affected.outputs.frontend == 'true'
        run: |
          smoke_url=$(node frontend/scripts/get-deployed-version-url.mjs)
          echo "DEPLOYED_FRONTEND_URL=$smoke_url" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for the deployed frontend version to be served
        if: steps.affected.outputs.frontend == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl -A codex-ci -X GET --fail --no-progress-meter --output /dev/null "$DEPLOYED_FRONTEND_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "The deployed frontend version did not return 200 within 5 minutes" >&2
          exit 1

      - name: Install Chromium for deployed frontend smoke
        if: steps.affected.outputs.frontend == 'true'
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the deployed frontend geometry
        if: steps.affected.outputs.frontend == 'true'
        working-directory: frontend
        run: npx playwright test -g '@deployed' --project=chromium
